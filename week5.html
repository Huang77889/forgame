<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch課程 - 烤糰子</title>
    <meta name="description" content="介紹課程表等等等" />
    <!-- 關鍵字標籤（Meta Keywords）：現今各大搜尋引擎（如Google）已不再重用此標籤，但部分系統可備用 -->
    <meta name="keywords" content="Scratch, 烤糰子, 小遊戲" />
    <link rel="stylesheet" href="style.css">

</head>



<script type="module">
  import { supabase } from './js/supabase.js';

  // ===== 基本設定 =====
  const WEEK_NUMBER = 5;
  const MAX_FILE_SIZE = 50 * 1024 * 1024;

  // ===== HTML 元素 =====
  const statusElement = document.getElementById('upload-status');
  const formElement = document.getElementById('assignment-form');
  const schoolElement = document.getElementById('school-id');
  const nameElement = document.getElementById('student-name');
  const numberElement = document.getElementById('student-number');
  const fileElement = document.getElementById('assignment-file');
  const submitButton = document.getElementById('submit-btn');


  // ===== 載入學校清單 =====
  async function loadSchools() {
    try {
      statusElement.textContent = '正在載入學校清單...';

      const { data, error } = await supabase
        .from('schools')
        .select('school_id, school_name')
        .eq('is_active', true)
        .order('school_name');

      if (error) {
        throw error;
      }

      if (!data || data.length === 0) {
        throw new Error('目前沒有可選擇的學校');
      }

      // 清空原本選項
      schoolElement.innerHTML = '';

      // 建立預設選項
      const defaultOption = document.createElement('option');
      defaultOption.value = '';
      defaultOption.textContent = '請選擇學校';
      schoolElement.appendChild(defaultOption);

      // 加入學校資料
      data.forEach(school => {
        const option = document.createElement('option');

        option.value = school.school_id;
        option.textContent = school.school_name;

        schoolElement.appendChild(option);
      });

      statusElement.textContent = '請填寫資料並選擇作業檔案。';

      console.log('學校清單載入成功：', data);

    } catch (error) {
      console.error('學校清單載入失敗：', error);

      statusElement.textContent =
        '學校清單載入失敗，請重新整理頁面。';
    }
  }


  // ===== 提交作業 =====
  formElement.addEventListener('submit', async function (event) {
    event.preventDefault();

    submitButton.disabled = true;

    try {
      // 1. 取得表單資料
      const schoolId = schoolElement.value;
      const studentName = nameElement.value.trim();
      const studentNumber = numberElement.value.trim();
      const file = fileElement.files[0];

      // 2. 檢查資料是否完整
      if (!schoolId || !studentName || !studentNumber || !file) {
        throw new Error('請填寫學校、姓名、學號並選擇作業檔案。');
      }

      // 3. 檢查檔案大小
      if (file.size === 0) {
        throw new Error('不可上傳空白檔案。');
      }

      if (file.size > MAX_FILE_SIZE) {
        throw new Error('檔案超過 50 MB，請選擇較小的檔案。');
      }

      // 4. 建立表單資料，準備傳送給 Edge Function
      const formData = new FormData();

      formData.append('school_id', schoolId);
      formData.append('student_name', studentName);
      formData.append('student_number', studentNumber);
      formData.append('week_number', String(WEEK_NUMBER));
      formData.append('file', file);

      // 5. 呼叫 Supabase Edge Function
      statusElement.textContent = '正在驗證學生資料並上傳作業，請稍候...';

      const { data, error } = await supabase.functions.invoke(
        'submit-assignment',
        {
          body: formData
        }
      );

      // 6. 處理伺服器錯誤
      if (error) {
        let errorMessage = error.message;

        if (error.context instanceof Response) {
          try {
            const result = await error.context.json();

            if (result.message) {
              errorMessage = result.message;
            }
          } catch (parseError) {
            console.log('無法讀取錯誤詳細資料');
          }
        }

        throw new Error(errorMessage);
      }

      // 7. 確認上傳結果
      if (!data || !data.success) {
        throw new Error(data?.message || '作業上傳失敗，請稍後再試。');
      }

      console.log('作業上傳成功：', data);

      statusElement.textContent =
        data.message || '作業上傳成功！';

      // 清空檔案欄位
      fileElement.value = '';

    } catch (error) {
      console.error('作業上傳失敗：', error);

      statusElement.textContent =
        `作業上傳失敗：${error.message}`;

    } finally {
      submitButton.disabled = false;
    }
  });


  // ===== 初始化 =====
  loadSchools();

</script>



<body>

    <h1>第 05 週：烤糰子</h1>

    <!-- 1. 作業下載區 -->
    <div class="section">
        <h3>📂 本週作業檔案下載</h3>
        <p>請同學先點擊主要作業檔，並依照老師的說明練習喔！</p>
        <!-- 請將下面的 # 替換成您實際的雲端硬碟或其他下載連結 
        <a href="https://turbowarp.org/1382019507/editor" class="btn" target="_blank">一二年級作業區</a>-->
        <a href="https://turbowarp.org/1363776188/editor" class="btn" target="_blank">作業區</a>
        <a href="https://docs.google.com/presentation/d/1yGYtdKXHUCmhUXs1Pm0kLqAHs6PIW2Lz/edit?usp=sharing&ouid=117177431560264184201&rtpof=true&sd=true" class="btn backup" target="_blank" >講議</a>
    </div>

    <!-- 2. 課後遊戲區（限制20分鐘後開啟） -->
    <div class="game-zone">
        <h3>🎮 課後挑戰遊戲區</h3>
        <!--<p id="lock-msg">🔒 上課認真聽！遊戲區將在 <span id="timer">40:00</span> 後解鎖。</p>-->
        <!-- 初始狀態設定為 disabled-link 限制點擊 
        <a href="https://scratch.mit.edu/projects/1363494332/fullscreen/" id="game-link" class="btn disabled-link" target="_blank">進入完整版遊戲</a>
        <a href="game-list.html" class="btn disabled-link" target="_blank">遊戲區列表</a>
    -->
        <button class="enter-game-btn" onclick="checkPassword()">遊戲區列表</button>

    </div>

    <!-- 3. 回首頁按鈕 -->
    <a href="index.html" class="home-btn">🏠 返回首頁</a>

    <!-- 作業繳交區 -->
    <section id="assignment-section">
        <h2>第五週作業繳交</h2>
        <p>請填寫基本資料並上傳本週作業。</p>

        <form id="assignment-form">
          <div class="form-group">
            <label for="school-id">就讀學校</label>
            <select id="school-id" name="school-id" required>
                <option value="">請選擇學校</option>
            </select>
          </div>

          <div class="form-group">
              <label for="student-name">學生姓名</label>
              <input
                  type="text"
                  id="student-name"
                  name="student-name"
                  placeholder="請輸入姓名"
                  required
              >
          </div>

          <div class="form-group">
              <label for="student-number">學號</label>
              <input
                  type="text"
                  id="student-number"
                  name="student-number"
                  placeholder="請輸入學號"
                  required
              >
          </div>

          <div class="form-group">
              <label for="assignment-file">作業檔案</label>
              <input
                  type="file"
                  id="assignment-file"
                  name="assignment-file"
                  required
              >
          </div>

          <button type="submit" id="submit-btn">
          提交作業
          </button>

          <p id="upload-status"></p>

        </form>
    </section>
    <!-- 作業繳交區結束 -->


    <script src="js/week.js"></script>


</body>
</html>
