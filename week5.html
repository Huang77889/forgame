<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scratch課程 - 烤糰子</title>
    <meta name="description" content="介紹課程表等等等" />
    <!-- 關鍵字標籤（Meta Keywords）：現今各大搜尋引擎（如Google）已不再重用此標籤，但部分系統可備用 -->
    <meta name="keywords" content="Scratch, 烤糰子, 小遊戲" />
    <link rel="stylesheet" href="style.css">

</head>


<script type="module">
  import { supabase } from './js/supabase.js';

  // ===== 基本設定 =====
  const WEEK_NUMBER = 5;
  const BUCKET_NAME = 'assignment-files';
  const MAX_FILE_SIZE = 50 * 1024 * 1024; // 50 MB

  // ===== HTML 元素 =====
  const statusElement = document.getElementById('upload-status');
  const formElement = document.getElementById('assignment-form');
  const nameElement = document.getElementById('student-name');
  const numberElement = document.getElementById('student-number');
  const fileElement = document.getElementById('assignment-file');
  const submitButton = document.getElementById('submit-btn');

  // ===== 取得學生登入身分 =====
  async function initializeStudent() {
    try {
      const {
        data: { session },
        error
      } = await supabase.auth.getSession();

      if (error) {
        throw error;
      }

      if (session) {
        console.log('學生已登入：', session.user.id);
        statusElement.textContent =
          '已取得學生身分，可以準備繳交作業。';
        return;
      }

      const { data, error: signInError } =
        await supabase.auth.signInAnonymously();

      if (signInError) {
        throw signInError;
      }

      console.log('匿名登入成功：', data.user.id);

      statusElement.textContent =
        '學生身分建立成功，可以準備繳交作業。';

    } catch (error) {
      console.error('匿名登入失敗：', error);

      statusElement.textContent =
        '身分建立失敗，請重新整理頁面。';
    }
  }

  // ===== 提交作業 =====
  formElement.addEventListener('submit', async function (event) {
    event.preventDefault();

    try {
      // 1. 取得表單資料
      const studentName = nameElement.value.trim();
      const studentNumber = numberElement.value.trim();
      const file = fileElement.files[0];

      if (!studentName || !studentNumber || !file) {
        statusElement.textContent =
          '請填寫姓名、學號並選擇作業檔案。';
        return;
      }

      // 2. 檢查檔案大小
      if (file.size > MAX_FILE_SIZE) {
        statusElement.textContent =
          '檔案超過 50 MB，請選擇較小的檔案。';
        return;
      }

      // 3. 取得目前登入身分
      const {
        data: { session },
        error: sessionError
      } = await supabase.auth.getSession();

      if (sessionError) {
        throw sessionError;
      }

      if (!session) {
        statusElement.textContent =
          '尚未取得學生身分，請重新整理頁面。';
        return;
      }

      const user = session.user;

      // 4. 建立固定的 Storage 檔案路徑
      const filePath =
        `${user.id}/week${WEEK_NUMBER}/submission`;

      // 5. 開始上傳檔案
      submitButton.disabled = true;

      statusElement.textContent = '作業上傳中，請稍候...';

      const { error: uploadError } = await supabase.storage
        .from(BUCKET_NAME)
        .upload(filePath, file, {
          upsert: true,
          contentType: file.type || 'application/octet-stream'
        });

      if (uploadError) {
        throw uploadError;
      }

      console.log('檔案上傳成功：', filePath);

      // 6. 寫入或更新資料庫紀錄
      const { error: databaseError } = await supabase
        .from('student_submissions')
        .upsert(
          {
            user_id: user.id,
            student_name: studentName,
            student_number: studentNumber,
            week_number: WEEK_NUMBER,
            file_name: file.name,
            file_path: filePath,
            submitted_at: new Date().toISOString()
          },
          {
            onConflict: 'user_id,week_number'
          }
        );

      if (databaseError) {
        throw databaseError;
      }

      // 7. 顯示成功訊息
      console.log('資料庫更新成功');

      statusElement.textContent =
        '作業上傳成功！若先前已繳交，本次將以最新版本為準。';

      // 清空檔案選擇欄位
      fileElement.value = '';

    } catch (error) {
      console.error('作業上傳失敗：', error);

      statusElement.textContent =
        `作業上傳失敗：${error.message}`;
    } finally {
      submitButton.disabled = false;
    }
  });

  // ===== 執行初始化 =====
  initializeStudent();
</script>


<body>

    <h1>第 05 週：烤糰子</h1>

    <!-- 1. 作業下載區 -->
    <div class="section">
        <h3>📂 本週作業檔案下載</h3>
        <p>請同學先點擊主要作業檔，並依照老師的說明練習喔！</p>
        <!-- 請將下面的 # 替換成您實際的雲端硬碟或其他下載連結 
        <a href="https://turbowarp.org/1382019507/editor" class="btn" target="_blank">一二年級作業區</a>-->
        <a href="https://turbowarp.org/1363776188/editor" class="btn" target="_blank">作業區</a>
        <a href="https://docs.google.com/presentation/d/1yGYtdKXHUCmhUXs1Pm0kLqAHs6PIW2Lz/edit?usp=sharing&ouid=117177431560264184201&rtpof=true&sd=true" class="btn backup" target="_blank" >講議</a>
    </div>

    <!-- 2. 課後遊戲區（限制20分鐘後開啟） -->
    <div class="game-zone">
        <h3>🎮 課後挑戰遊戲區</h3>
        <!--<p id="lock-msg">🔒 上課認真聽！遊戲區將在 <span id="timer">40:00</span> 後解鎖。</p>-->
        <!-- 初始狀態設定為 disabled-link 限制點擊 
        <a href="https://scratch.mit.edu/projects/1363494332/fullscreen/" id="game-link" class="btn disabled-link" target="_blank">進入完整版遊戲</a>
        <a href="game-list.html" class="btn disabled-link" target="_blank">遊戲區列表</a>
    -->
        <button class="enter-game-btn" onclick="checkPassword()">遊戲區列表</button>

    </div>

    <!-- 3. 回首頁按鈕 -->
    <a href="index.html" class="home-btn">🏠 返回首頁</a>

    <!-- 作業繳交區 -->
    <section id="assignment-section">
        <h2>第五週作業繳交</h2>
        <p>請填寫基本資料並上傳本週作業。</p>

        <form id="assignment-form">

            <div class="form-group">
                <label for="student-name">學生姓名</label>
                <input
                    type="text"
                    id="student-name"
                    name="student-name"
                    placeholder="請輸入姓名"
                    required
                >
            </div>

            <div class="form-group">
                <label for="student-number">學號</label>
                <input
                    type="text"
                    id="student-number"
                    name="student-number"
                    placeholder="請輸入學號"
                    required
                >
            </div>

            <div class="form-group">
                <label for="assignment-file">作業檔案</label>
                <input
                    type="file"
                    id="assignment-file"
                    name="assignment-file"
                    required
                >
            </div>

            <button type="submit" id="submit-btn">
            提交作業
            </button>

            <p id="upload-status"></p>

        </form>
    </section>
    <!-- 作業繳交區結束 -->


    <script src="js/week.js"></script>


</body>
</html>
