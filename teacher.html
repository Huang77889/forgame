
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教師作業管理</title>
</head>
<body>

  <h1>教師作業管理系統</h1>

    <section id="login-section">
        <h2>教師登入</h2>

        <form id="login-form">
        <div>
            <label for="email">電子郵件</label>
            <input type="email" id="email" required>
        </div>

        <div>
            <label for="password">密碼</label>
            <input type="password" id="password" required>
        </div>

        <button type="submit" id="login-btn">登入</button>
        </form>
    </section>

    <p id="login-status"></p>

    <section id="teacher-section" hidden>
        <h2>教師作業管理</h2>

        <p id="teacher-email"></p>

        <button id="logout-btn">登出</button>

        <hr>

        <h3>學生作業列表</h3>
        <button id="download-all-btn">
            下載全部作業（ZIP）
        </button>
        <p id="submission-status">正在載入作業資料...</p>

        <table border="1" cellpadding="8">
            <thead>
            <tr>
                <th>學生姓名</th>
                <th>學號</th>
                <th>週次</th>
                <th>檔案名稱</th>
                <th>繳交時間</th>
                <th>下載作業</th>
            </tr>
            </thead>

            <tbody id="submission-list"></tbody>
        </table>
    </section>

  <script type="module">
    import { supabase } from './js/supabase.js';
    import JSZip from 'https://cdn.jsdelivr.net/npm/jszip@3.10.1/+esm';

    const loginForm = document.getElementById('login-form');
    const loginSection = document.getElementById('login-section');
    const teacherSection = document.getElementById('teacher-section');
    const loginStatus = document.getElementById('login-status');
    const teacherEmail = document.getElementById('teacher-email');

    // 檢查目前登入者是否為教師
    async function checkTeacher() {
      const { data: { session }, error } =
        await supabase.auth.getSession();

      if (error) {
        console.error(error);
        return;
      }

      if (!session) return;

      const user = session.user;

      if (user.app_metadata?.role === 'teacher') {
        showTeacher(user);
      } else {
        loginStatus.textContent = '此帳號沒有教師權限。';
      }
    }

    // 顯示教師頁面
    async function showTeacher(user) {
      loginSection.hidden = true;
      teacherSection.hidden = false;
      teacherEmail.textContent = `登入帳號：${user.email}`;
      loginStatus.textContent = '教師登入成功！';
      await loadSubmissions();
    }
    // 讀取學生作業資料
    async function loadSubmissions() {
        const status = document.getElementById('submission-status');
        const list = document.getElementById('submission-list');

        status.textContent = '正在載入作業資料...';
        list.replaceChildren();

        const { data, error } = await supabase
            .from('student_submissions')
            .select('*')
            .order('submitted_at', { ascending: false });

        if (error) {
            console.error('讀取作業失敗：', error);
            status.textContent = '讀取失敗，請檢查資料庫權限。';
            return;
        }

        if (!data || data.length === 0) {
            status.textContent = '目前沒有學生繳交作業。';
            return;
        }

        data.forEach((submission) => {
            const row = document.createElement('tr');

            const values = [
                submission.student_name,
                submission.student_number,
                `第 ${submission.week_number} 週`,
                submission.file_name,
                new Date(submission.submitted_at).toLocaleString('zh-TW')
            ];

            values.forEach((value) => {
                const cell = document.createElement('td');
                cell.textContent = value ?? '';
                row.appendChild(cell);
            });

            // 建立下載按鈕
            const downloadCell = document.createElement('td');
            const downloadButton = document.createElement('button');

            downloadButton.textContent = '下載作業';

            downloadButton.addEventListener('click', async () => {
                const { data, error } = await supabase.storage
                    .from('assignment-files')
                    .createSignedUrl(submission.file_path, 120);

                if (error) {
                    console.error('下載連結建立失敗：', error);
                    alert('無法取得下載連結。');
                    return;
                }

                window.open(data.signedUrl, '_blank');
            });

            downloadCell.appendChild(downloadButton);
            row.appendChild(downloadCell);

            list.appendChild(row);
        });

        status.textContent = `目前共有 ${data.length} 筆作業紀錄。`;

        console.log('作業資料讀取成功：', data);
    }

    // 教師登入
    loginForm.addEventListener('submit', async (event) => {
      event.preventDefault();

      loginStatus.textContent = '登入中...';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      const { data, error } =
        await supabase.auth.signInWithPassword({
          email,
          password
        });

      if (error) {
        console.error('登入失敗：', error);
        loginStatus.textContent = '登入失敗，請確認帳號與密碼。';
        return;
      }

      if (data.user.app_metadata?.role !== 'teacher') {
        await supabase.auth.signOut();
        loginStatus.textContent = '此帳號沒有教師權限。';
        return;
      }

      showTeacher(data.user);
    });

    // 登出
    document.getElementById('logout-btn')
      .addEventListener('click', async () => {
        await supabase.auth.signOut();

        teacherSection.hidden = true;
        loginSection.hidden = false;
        loginStatus.textContent = '已登出。';
      });

    checkTeacher();
  </script>

</body>
</html>
